# Example solver configuration. Copy to your project's smtbatch.toml and
# replace the solver paths. This example is not discovered automatically.

[defaults]
inputs = "benchmarks"
results = "results"
port = 8000

[solvers.my-solver]
label = "My solver"
binary = "/opt/my-solver/bin/my-solver"
command = ["gtimeout", "--kill-after=1", "{timeout}", "{binary}", "{input}"]

[solvers.another-solver]
binary = "/opt/another-solver/bin/another-solver"
command = ["gtimeout", "--kill-after=1", "{timeout}", "{binary}", "{input}"]
version_args = ["--version"]
