[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smtbatch"
version = "0.1.0"
description = "Local SMT-LIB batch experiment console: parallel solver queues, live dashboard, Excel export."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "tomli>=2; python_version<'3.11'",
]

[project.scripts]
smtbatch = "smtbatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smtbatch"]
