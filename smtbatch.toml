# smtbatch solver configuration. Discovered automatically (nearest
# smtbatch.toml walking upward from the current directory).

[defaults]
inputs = "benchmarks"
results = "results"
port = 8000
target_branch = "feat/incremental"

[solvers.my-solver]
label = "My solver"
binary = "/opt/my-solver/bin/my-solver"
command = ["gtimeout", "--kill-after=1", "{timeout}", "{binary}", "{input}"]

[solvers.another-solver]
binary = "/opt/another-solver/bin/another-solver"
command = ["gtimeout", "--kill-after=1", "{timeout}", "{binary}", "{input}"]
version_args = ["--version"]
