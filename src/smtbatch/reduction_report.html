<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SMTBatch Reduce · Results</title>
  <style>
    :root{--page:#07111b;--panel:#0f1d2b;--panel2:#142636;--soft:#0c1926;--line:#263b4e;--text:#e9f1f7;--muted:#8fa5b8;--accent:#47d7a1;--blue:#80bcff;--red:#ff827a;--yellow:#f0c96c}
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}
    .top{background:var(--panel);color:var(--text);border-bottom:1px solid var(--line);padding:22px max(22px,calc((100vw - 1320px)/2));display:flex;align-items:center;gap:18px}
    .top h1{font-size:20px;margin:0;overflow-wrap:anywhere}
    .top a{color:var(--blue);text-decoration:none}
    .wrap{max-width:1320px;margin:20px auto;padding:0 20px 50px}
    .panel{background:linear-gradient(145deg,rgba(15,29,43,.98),rgba(11,23,35,.98));border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:16px}
    .head{display:flex;gap:16px;justify-content:space-between;align-items:start}
    .muted{color:var(--muted)}
    .badge{display:inline-block;border-radius:99px;padding:2px 7px;background:rgba(143,165,184,.12);color:var(--muted);font-size:10px;text-transform:uppercase}
    .badge.live{background:rgba(128,188,255,.13);color:var(--blue)}
    .badge.ok{background:rgba(71,215,161,.13);color:var(--accent)}
    .badge.bad{background:rgba(255,130,122,.13);color:var(--red)}
    .badge.warn{background:rgba(240,201,108,.13);color:var(--yellow)}
    button,.button{border:1px solid rgba(71,215,161,.6);border-radius:8px;padding:9px 12px;background:var(--accent);color:#061a17;font-weight:700;cursor:pointer;text-decoration:none}
    button.secondary{background:var(--soft);color:var(--text);border-color:var(--line)}
    button.warn{background:rgba(240,201,108,.14);color:var(--yellow);border-color:rgba(240,201,108,.4)}
    button.danger{background:rgba(255,130,122,.15);color:var(--red);border-color:rgba(255,130,122,.35)}
    button:disabled{opacity:.45}
    .actions,.toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
    .toolbar{margin:13px 0}
    .toolbar label{font-size:11px;color:var(--muted);text-transform:uppercase}
    .toolbar input,.toolbar select{display:block;margin-top:4px;border:1px solid var(--line);border-radius:7px;padding:8px;background:var(--soft);color:var(--text)}
    .case-list .toolbar{margin:0 0 4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
    .case-list .toolbar label{flex:1 1 120px}
    .case-list .toolbar input,.case-list .toolbar select{width:100%;padding:6px 8px;font-size:13px;background:var(--panel2)}
    .case-list .toolbar button{padding:6px 11px;font-size:13px;font-weight:600}
    .notice{padding:10px;border-radius:8px;background:rgba(240,201,108,.12);color:var(--yellow);margin-top:10px}
    .notice.ok{background:rgba(71,215,161,.1);color:var(--accent)}
    .scroll{overflow:auto}
    table{border-collapse:collapse;width:100%}
    th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
    th{font-size:11px;text-transform:uppercase;color:var(--muted)}
    tr:last-child td{border-bottom:0}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    .summary-table{margin-top:14px}
    .summary-table th,.summary-table td{text-align:center}
    .case-layout{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(0,1.35fr);gap:16px;margin-top:14px;align-items:start}
    .case-list{min-width:0;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 10px 0;display:flex;flex-direction:column}
    .case-list .scroll{flex:1;max-height:620px}
    .pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:9px 2px;border-top:1px solid var(--line)}
    .pager button{padding:5px 11px;font-size:12px;font-weight:600}
    .pager span{font-size:12px}
    .case-row{cursor:pointer}
    .case-row:hover td{background:rgba(128,188,255,.06)}
    .case-row.selected td{background:rgba(71,215,161,.09)}
    .case-link{background:none;border:0;color:var(--blue);padding:0;cursor:pointer}
    .detail{min-width:0;display:none;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px}
    .detail.open{display:block}
    .legend{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
    .legend button{background:var(--soft);color:var(--text);border:1px solid var(--line)}
    .legend button.off{opacity:.42}
    .chart{border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px;overflow:hidden}
    .chart h3{margin:0 0 5px;font-size:12px}
    .chart svg{display:block;width:100%;height:auto}
    .grid{stroke:#22374a;stroke-width:1}
    .axis{stroke:#51687c;stroke-width:1}
    .curve{fill:none;stroke-width:2}
    .accept{stroke:var(--page);stroke-width:1.5}
    .error{color:var(--red)}
    .logs{margin-top:16px}
    .logs details{border:1px solid var(--line);border-radius:9px;margin-top:8px;background:var(--soft)}
    .logs summary{cursor:pointer;padding:10px;font-weight:700}
    .logs h4{margin:10px 12px 4px;font-size:11px;color:var(--muted);text-transform:uppercase}
    .logs pre{margin:0 12px 12px;padding:10px;max-height:260px;overflow:auto;background:#0a1520;color:#e7eef3;border-radius:7px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.4 ui-monospace,SFMono-Regular,monospace}
    @media(max-width:1050px){.case-layout{grid-template-columns:1fr}.head{display:block}.actions{margin-top:10px}}
  </style>
</head>
<body>
  <header class="top"><a href="/">← Reduction runs</a><h1 id="title">SMTBatch Reduce · Results</h1><span id="status"></span></header>
  <main class="wrap">
    <div id="error" class="error"></div>
    <section class="panel">
      <h2 style="margin:0">Run summary</h2>
      <div id="evidence"></div>
      <div class="scroll"><table class="summary-table"><thead id="reducerHead"></thead><tbody id="reducerRows"></tbody></table></div>
    </section>
    <section class="panel">
      <h2 style="margin:0">Cases</h2>
      <div class="case-layout">
        <div class="case-list">
          <div class="toolbar">
            <label>Text<input id="query" placeholder="case, family, theory"></label>
            <label>Reducer<select id="reducer"><option value="">All</option></select></label>
            <label>Status<select id="caseStatus"><option value="">All</option><option>running</option><option>pending</option><option>completed</option><option>truncated</option><option>invalid</option></select></label>
            <button id="filter" class="secondary">Apply</button>
          </div>
          <div class="scroll"><table><thead><tr><th>Case</th><th>Status</th><th class="num">Trials</th></tr></thead><tbody id="cases"></tbody></table></div>
          <div class="pager"><button id="prev" class="secondary">‹ Prev</button><span id="page" class="muted"></span><button id="next" class="secondary">Next ›</button></div>
        </div>
        <div id="detail" class="detail">
          <h3 id="caseTitle" style="margin:0"></h3>
          <div id="caseSub" class="muted"></div>
          <div class="scroll" style="margin-top:10px"><table><thead><tr><th>Reducer</th><th>Status</th><th class="num">Calls</th><th class="num">Accepted</th><th class="num">Final bytes</th><th class="num">Ratio</th></tr></thead><tbody id="trialRows"></tbody></table></div>
          <div class="legend" id="legend"></div>
          <div class="chart"><h3>Size over time (serialized bytes)</h3><svg id="sizeChart" viewBox="0 0 580 300"></svg></div>
          <div class="chart"><h3>Accepted moves over time</h3><svg id="opsChart" viewBox="0 0 580 300"></svg></div>
        </div>
      </div>
    </section>
    <section id="logs" class="panel logs">
      <h2 style="margin:0">Reducer logs</h2>
      <div id="logTrials" class="muted">Select a case to inspect its bounded stdout and stderr.</div>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id),parts=location.pathname.split('/'),runId=decodeURIComponent(parts[2]||''),state={summary:null,cases:null,trajectory:null,page:1,selected:null,autoOpened:false,hidden:new Set()};
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v==null?'—':(typeof v==='number'&&!Number.isInteger(v)?v.toFixed(2):Number(v).toLocaleString());
    const seconds=v=>{const n=Number(v)||0;return n<60?n.toFixed(1)+'s':Math.floor(n/60)+'m '+String(Math.round(n%60)).padStart(2,'0')+'s'};
    const COLORS=['#47d7a1','#80bcff','#f0c96c','#d8a4ff','#ff827a','#66d9e8'];
    function bucketCounts(statuses){const b={completed:0,truncated:0,invalid:0};for(const[k,n]of Object.entries(statuses||{}))b[k in b?k:'invalid']+=Number(n)||0;return b}
    function badge(s){const c=['complete','completed'].includes(s)?'ok':['running','starting','resuming','stopping','aborting'].includes(s)?'live':s==='truncated'?'warn':['failed','invalid','interrupted'].includes(s)?'bad':'';return `<span class="badge ${c}">${esc(s||'unknown')}</span>`}
    async function api(url,opt){const r=await fetch(url,opt),d=await r.json();if(!r.ok)throw new Error(d.error||r.statusText);return d}
    function reducerColor(id){const ids=Object.keys((state.summary||{}).by_reducer||{id:0});const i=Math.max(0,ids.indexOf(id));return COLORS[i%COLORS.length]}

    function renderSummary(){
      const r=state.summary;
      $('title').textContent=`${r.run_id}`;
      $('status').innerHTML=badge(r.status);
      const notes=[];
      if(r.stale_status)notes.push(`Stale controller state ${r.stale_status}; resume will create new attempts.`);
      $('evidence').innerHTML=notes.length?`<div class="notice">${esc(notes.join(' · '))}</div>`:'';
      $('reducerHead').innerHTML='<tr><th>Reducer</th><th class="num">Done</th><th class="num">completed</th><th class="num">truncated</th><th class="num">invalid</th><th class="num">Calls</th><th class="num">Accepted</th></tr>';
      $('reducerRows').innerHTML=Object.values(r.by_reducer||{}).map(v=>{const b=bucketCounts(v.statuses);return `<tr><td>${esc(v.label)}</td><td class="num">${fmt(v.completed)} / ${fmt(v.planned)}</td><td class="num">${fmt(b.completed)}</td><td class="num">${fmt(b.truncated)}</td><td class="num">${fmt(b.invalid)}</td><td class="num">${fmt(v.predicate_calls)}</td><td class="num">${fmt(v.accepted_moves)}</td></tr>`}).join('')||'<tr><td class="muted">No reducers in this run.</td></tr>';
      $('reducer').innerHTML='<option value="">All</option>'+Object.values(r.by_reducer||{}).map(v=>`<option value="${esc(v.id)}">${esc(v.label)}</option>`).join('');
    }

    async function loadCases(){
      const q=new URLSearchParams({page:String(state.page),page_size:'25'});
      if($('query').value)q.set('q',$('query').value);
      if($('reducer').value)q.set('reducer',$('reducer').value);
      if($('caseStatus').value)q.set('status',$('caseStatus').value);
      state.cases=await api(`/api/runs/${encodeURIComponent(runId)}/cases?${q}`);
      $('cases').innerHTML=state.cases.cases.map(c=>`<tr class="case-row${state.selected===c.case_id?' selected':''}" data-case="${esc(c.case_id)}"><td><b>${esc(c.case_id)}</b><div class="muted">${esc(c.family)} / ${esc(c.theory)}</div></td><td>${badge(c.status)}</td><td class="num">${fmt(c.completed)} / ${fmt(c.planned)}</td></tr>`).join('')||'<tr><td class="muted">No cases match the current filters.</td></tr>';
      $('page').textContent=`Page ${state.cases.page} / ${state.cases.pages||1} · ${state.cases.total} cases`;
      $('prev').disabled=state.page<=1;$('next').disabled=state.page>=(state.cases.pages||1);
      if(!state.autoOpened&&state.cases.cases.length){state.autoOpened=true;openCase(state.cases.cases[0].case_id)}
    }

    function axisBox(svg,W,H,maxX,maxY,ylabel){
      const L=52,R=12,T=12,B=30;
      svg.innerHTML='';
      for(let i=0;i<=4;i++){
        const gx=L+(W-L-R)*i/4,gy=T+(H-T-B)*i/4;
        svg.insertAdjacentHTML('beforeend',`<line class="grid" x1="${gx}" y1="${T}" x2="${gx}" y2="${H-B}"/><line class="grid" x1="${L}" y1="${gy}" x2="${W-R}" y2="${gy}"/>`);
        svg.insertAdjacentHTML('beforeend',`<text x="${gx}" y="${H-8}" font-size="10" fill="#8fa5b8" text-anchor="middle">${seconds(maxX*i/4)}</text>`);
        svg.insertAdjacentHTML('beforeend',`<text x="${L-6}" y="${T+(H-T-B)*(4-i)/4+3}" font-size="10" fill="#8fa5b8" text-anchor="end">${fmt(Math.round(maxY*i/4))}</text>`);
      }
      svg.insertAdjacentHTML('beforeend',`<line class="axis" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/><line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${H-B}"/>`);
      return {L,R,T,B,X:v=>L+(W-L-R)*Math.min(1,Math.max(0,v/maxX)),Y:v=>T+(H-T-B)*(1-Math.min(1,Math.max(0,v/maxY)))};
    }

    function drawCharts(){
      const d=state.trajectory,trials=(d.trials||[]).filter((_,i)=>!state.hidden.has(i));
      // size chart: step-down of serialized bytes over wall time, one curve per trial
      let series=trials.map(t=>{const pts=(t.trajectory?.points||[]).slice().sort((a,b)=>Number(a.elapsed_sec||0)-Number(b.elapsed_sec||0));return{t,pts}});
      const maxT=Math.max(1,...series.flatMap(s=>s.pts.map(p=>Number(p.elapsed_sec||0))));
      const maxB=Math.max(1,...series.flatMap(s=>s.pts.map(p=>Number(p.byte_count||0))));
      const sizeSvg=$('sizeChart'),box=axisBox(sizeSvg,580,300,maxT,maxB);
      for(const s of series){
        if(!s.pts.length)continue;
        const color=reducerColor(s.t.reducer_id);
        let dPath=`M ${box.X(Number(s.pts[0].elapsed_sec||0))} ${box.Y(Number(s.pts[0].byte_count||0))}`;
        for(let i=1;i<s.pts.length;i++)dPath+=` H ${box.X(Number(s.pts[i].elapsed_sec||0))} V ${box.Y(Number(s.pts[i].byte_count||0))}`;
        sizeSvg.insertAdjacentHTML('beforeend',`<path class="curve" stroke="${color}" d="${dPath}"/>`);
        s.pts.filter(p=>p.accepted&&Number(p.call_index||0)>0).forEach(p=>{sizeSvg.insertAdjacentHTML('beforeend',`<circle class="accept" fill="${color}" cx="${box.X(Number(p.elapsed_sec||0))}" cy="${box.Y(Number(p.byte_count||0))}" r="3.5"><title>${esc(s.t.reducer_label)} / r${esc(s.t.repeat)} · ${seconds(Number(p.elapsed_sec||0))} · ${esc(p.mutator||'')} · ${fmt(p.byte_count)} B</title></circle>`)});
      }
      // accepted-moves chart: cumulative accepted count over wall time
      const opsSvg=$('opsChart');
      let opsSeries=series.map(s=>{let acc=0;const pts=[[0,0]];for(const p of s.pts){if(p.accepted){acc+=1;pts.push([Number(p.elapsed_sec||0),acc])}}return{t:s.t,pts,acc}});
      const maxA=Math.max(1,...opsSeries.map(s=>s.acc));
      const obox=axisBox(opsSvg,580,300,maxT,maxA);
      for(const s of opsSeries){
        if(!s.acc)continue;
        const color=reducerColor(s.t.reducer_id);
        let dPath=`M ${obox.X(s.pts[0][0])} ${obox.Y(s.pts[0][1])}`;
        for(let i=1;i<s.pts.length;i++)dPath+=` H ${obox.X(s.pts[i][0])} V ${obox.Y(s.pts[i][1])}`;
        dPath+=` H ${obox.X(maxT)}`;
        opsSvg.insertAdjacentHTML('beforeend',`<path class="curve" stroke="${color}" d="${dPath}"/>`);
      }
    }

    function renderTrajectory(){
      const d=state.trajectory,trials=d.trials||[];
      $('detail').classList.add('open');
      $('caseTitle').textContent=`${d.case.id}`;
      $('caseSub').textContent=`${d.case.family} · ${d.case.theory} · ${d.case.predicate_mode}`;
      $('trialRows').innerHTML=trials.map(t=>{const tr=t.trajectory||{},fin=tr.final||{},init=tr.initial||{},ratio=init.byte_count?fin.byte_count/init.byte_count:null;return `<tr><td>${esc(t.reducer_label)} <span class="muted">r${esc(t.repeat)}</span></td><td>${badge(t.status)}</td><td class="num">${fmt(tr.candidate_calls)}</td><td class="num">${fmt(tr.accepted_moves)}</td><td class="num">${fmt(fin.byte_count)}</td><td class="num">${ratio==null?'—':(ratio*100).toFixed(1)+'%'}</td></tr>`}).join('');
      $('legend').innerHTML=trials.map((t,i)=>`<button class="${state.hidden.has(i)?'off':''}" onclick="toggle(${i})"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${reducerColor(t.reducer_id)};margin-right:5px"></i>${esc(t.reducer_label)} / r${esc(t.repeat)} ${badge(t.status)}</button>`).join('');
      drawCharts();
    }

    function renderLogs(){
      const trials=state.trajectory?.trials||[];
      const open=new Set([...$('logTrials').querySelectorAll('details')].flatMap((d,i)=>d.open?[i]:[]));
      $('logTrials').innerHTML=trials.length?trials.map(t=>{const logs=t.logs||{},out=logs.stdout?.text||'—',err=logs.stderr?.text||'—',suffix=(logs.stdout?.truncated||logs.stderr?.truncated)?' · truncated':'';return `<details><summary>${esc(t.reducer_label)} / repeat ${esc(t.repeat)} · ${esc(t.status)}${esc(suffix)}</summary><h4>stdout</h4><pre>${esc(out)}</pre><h4>stderr</h4><pre>${esc(err)}</pre></details>`}).join(''):'Select a case to inspect its bounded stdout and stderr.';
      $('logTrials').querySelectorAll('details').forEach((d,i)=>{if(open.has(i))d.open=true});
    }

    async function openCase(id){
      state.selected=id;state.hidden.clear();
      state.trajectory=await api(`/api/runs/${encodeURIComponent(runId)}/cases/${encodeURIComponent(id)}/trajectory`);
      $('logTrials').innerHTML='';
      renderTrajectory();renderLogs();
      document.querySelectorAll('.case-row').forEach(row=>row.classList.toggle('selected',row.dataset.case===id));
    }
    function toggle(i){state.hidden.has(i)?state.hidden.delete(i):state.hidden.add(i);drawCharts()}

    async function refresh(all=true){
      try{
        state.summary=await api(`/api/runs/${encodeURIComponent(runId)}/summary`);
        renderSummary();
        if(all)await loadCases();
        if(state.trajectory){state.trajectory=await api(`/api/runs/${encodeURIComponent(runId)}/cases/${encodeURIComponent(state.trajectory.case.id)}/trajectory`);renderTrajectory();renderLogs()}
        $('error').textContent='';
      }catch(e){$('error').textContent=e.message}
    }
    $('filter').onclick=()=>{state.page=1;state.autoOpened=false;loadCases()};
    $('prev').onclick=()=>{state.page--;loadCases()};
    $('next').onclick=()=>{state.page++;loadCases()};
    $('cases').addEventListener('click',event=>{const row=event.target.closest('.case-row');if(row)openCase(row.dataset.case)});
    window.toggle=toggle;
    refresh();
    setInterval(()=>refresh(false),2500);
  </script>
</body>
</html>
